name: quire

services:
  postgres:
    image: postgres:16-alpine
    container_name: quire-postgres
    environment:
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
      POSTGRES_DB: report_core
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d report_core"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: quire-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quire_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  playwright:
    image: mcp/playwright:latest
    container_name: quire-playwright
    init: true
    shm_size: "1gb"
    command:
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
      # The MCP host check compares the full Host header, including the port.
      - "--allowed-hosts"
      - "localhost:${PLAYWRIGHT_MCP_PORT:-8931},127.0.0.1:${PLAYWRIGHT_MCP_PORT:-8931},quire-playwright:8931"
      - "--image-responses"
      - "allow"
      - "--isolated"
    ports:
      - "${PLAYWRIGHT_MCP_PORT:-8931}:8931"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped


volumes:
  quire_pgdata:
  quire_redisdata:
