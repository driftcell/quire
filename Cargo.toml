[workspace]
members = [
  "crates/quire-protocol",
  "crates/quire-lint",
  "crates/quire-store",
  "crates/quire-server",
  "crates/quire-session-protocol",
  "crates/quire-runtime",
  "crates/quire-migrate",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quire-protocol = { path = "crates/quire-protocol" }
quire-lint = { path = "crates/quire-lint" }
quire-store = { path = "crates/quire-store" }
quire-server = { path = "crates/quire-server" }
quire-session-protocol = { path = "crates/quire-session-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [
  "preserve_order",
  "float_roundtrip",
] }
regex = "1.12"
rayon = "1.11"
aho-corasick = "1.1"
schemars = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
thiserror = "2.0"
secrecy = "0.10"
subtle = "2.6"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "json",
  "chrono",
  "migrate",
  "macros",
] }
redis = { version = "1.8", features = [
  "tokio-comp",
  "streams",
  "connection-manager",
] }
zstd = "0.14"
moka = { version = "0.12", features = ["future"] }
serde_yaml_ng = "0.10"
base64 = "0.22"
ring = "0.17"
rig = { version = "0.46.0", features = [
  "derive",
  "memory",
  "postgres",
  "rmcp",
  "reqwest",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rmcp = { version = "3.10", features = [
  "server",
  "client",
  "macros",
  "schemars",
  "reqwest",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
http = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
